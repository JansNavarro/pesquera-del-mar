<div class="group-input">
    <div class="label"><label>{{label()}}</label> <span>*</span></div>

    <div class="input">

        <input
            [placeholder]="placeholder()"
            [type]="type()"
            [value]="value()"
            [disabled]="disabled()"
            
            (input)="onInput($event)"
            (blur)="onBlur()"
        >

        @if (showError() && messageError()) {
            <div class="error">
                <span>{{messageError()}}</span>
            </div>
        }
    </div>







</div>
